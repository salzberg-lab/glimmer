name: Build release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p obj bin lib
          cd SimpleMake
          make

      - name: Show binaries
        run: |
          ls -lh bin/
          file bin/*

      - name: Test executable
        run: |
          ./bin/glimmer3 -h || [ $? -eq 1 ]

      - name: Package
        run: |
          mkdir glimmer-${{ github.ref_name }}-linux-x86_64
          cp bin/* glimmer-${{ github.ref_name }}-linux-x86_64/
          tar czf glimmer-${{ github.ref_name }}-linux-x86_64.tar.gz \
            glimmer-${{ github.ref_name }}-linux-x86_64

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glimmer-*.tar.gz
